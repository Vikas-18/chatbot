<div class="form-container">
  <div class="container-lg">
    <div class="head">
      <h1>Hostel Chat Bot</h1>
    </div>
    <div class="signin">
      <h2>Sign Up For Your Account</h2>

      <form (ngSubmit)="handleSubmit()">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Enter Your Full Name"
            required
            [(ngModel)]="name"
          />
        </div>

        <div class="form-group">
          <label for="rollNo" class="form-label">Enrollment Number</label>
          <input
            type="text"
            class="form-control"
            id="rollNo"
            name="rollNo"
            placeholder="Enter Your Enrollment Number"
            required
            [(ngModel)]="rollNo"
          />
        </div>

        <div class="form-group">
          <label for="hostelName" class="form-label">Hostel</label>
          <select
            class="form-control"
            id="hostelName"
            name="hostelName"
            required
            [(ngModel)]="hostelName"
          >
            <option value="">Choose Your Hostel</option>
            <option *ngFor="let h of hostels" [value]="h">{{ h }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="roomNo" class="form-label">Room Number</label>
          <input
            type="text"
            class="form-control"
            id="roomNo"
            name="roomNo"
            placeholder="Enter Your Room Number"
            required
            [(ngModel)]="roomNo"
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter Your Password"
            required
            [(ngModel)]="password"
          />
        </div>

        <div class="form-group">
          <label for="cpassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            class="form-control"
            id="cpassword"
            name="cpassword"
            placeholder="Re-enter Your Password"
            required
            [(ngModel)]="cpassword"
          />
        </div>

        <button type="submit" class="btn btn-dark" [disabled]="loading">
          <span *ngIf="!loading">Submit</span>
          <span *ngIf="loading">Creating Account...</span>
        </button>
      </form>

      <div class="switch-link">
        <p>Already have an account? <a routerLink="/login">Log In</a></p>
      </div>
    </div>
  </div>
</div>
